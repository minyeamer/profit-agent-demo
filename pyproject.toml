[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profit_agent_demo"]

[project]
name = "profit-agent-demo"
version = "0.1.0"
description = "A Korean natural-language analytics demo for a profit_daily PostgreSQL table function"
requires-python = ">=3.11"
dependencies = [
  "altair>=5.0.0",
  "mcp>=1.2.0,<2.0.0",
  "openai>=1.60.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.2.0",
  "PyYAML>=6.0",
  "streamlit>=1.40.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
profit-agent-mcp = "profit_agent_demo.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
